[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "filingexplorer-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the FilingExplorer API: SEC filings, financials, 13F holdings, insider trades and watchlists."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Giant Octopus, LLC", email = "hello@giantoctopus.ink" }]
keywords = ["mcp", "sec", "edgar", "13f", "form-4", "financials"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=1.12,<2",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://www.filingexplorer.com"
Documentation = "https://github.com/FilingExplorer/FilingExplorer-MCP#readme"
Repository = "https://github.com/FilingExplorer/FilingExplorer-MCP"
Issues = "https://github.com/FilingExplorer/FilingExplorer-MCP/issues"
Changelog = "https://github.com/FilingExplorer/FilingExplorer-MCP/blob/main/CHANGELOG.md"
"API documentation" = "https://www.filingexplorer.com/api-docs"

[project.scripts]
filingexplorer-mcp = "filingexplorer_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/filingexplorer_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real FilingExplorer API (needs FILING_EXPLORER_API_TOKEN)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
