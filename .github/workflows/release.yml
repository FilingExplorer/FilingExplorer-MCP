name: Release

# Publishes to PyPI when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# PyPI trusted publishing: the "pypi" environment and this workflow must be registered
# as a trusted publisher on the PyPI project. No API token is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          module=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/filingexplorer_mcp/__init__.py').read()).group(1))")
          if [ "$tag" != "$project" ] || [ "$tag" != "$module" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject ($project) and __init__ ($module)." >&2
            exit 1
          fi
      - name: Tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Write pattern file
        env:
          SCRUB_TERMS: ${{ secrets.SCRUB_TERMS }}
        run: |
          if [ -z "$SCRUB_TERMS" ]; then
            echo "The SCRUB_TERMS secret is not available." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$SCRUB_TERMS" > "$RUNNER_TEMP/scrub_terms.txt"
          echo "FE_SCRUB_TERMS=$RUNNER_TEMP/scrub_terms.txt" >> "$GITHUB_ENV"
      - name: Publication check (full history)
        run: python scripts/scrub_check.py --history --release
      - name: Remove pattern file
        if: always()
        run: rm -f "$RUNNER_TEMP/scrub_terms.txt"
      - name: Lint and test
        run: |
          uv sync --all-groups
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      - name: Build
        run: uv build
      - name: List built files
        run: |
          python -m zipfile -l dist/*.whl
          tar -tzf dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/filingexplorer-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
